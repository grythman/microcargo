<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargo — Админ</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">📦</span> Cargo · Админ</div>
    <nav>
      <a href="/">Захиалагчийн хэсэг</a>
      <a href="#" id="logoutLink" class="hidden">Гарах</a>
    </nav>
  </div>

  <!-- ===================== ADMIN LOGIN ===================== -->
  <div class="container narrow" id="loginView">
    <div class="card">
      <h1>Админ нэвтрэх</h1>
      <p class="subtitle">Зөвхөн карго оператор нэвтэрнэ.</p>
      <form id="adminLoginForm">
        <label>Нэвтрэх нэр</label>
        <input type="text" id="adminUsername" placeholder="admin" required />
        <label>Нууц үг</label>
        <input type="password" id="adminPassword" placeholder="••••••" required />
        <button type="submit" class="btn full">Нэвтрэх</button>
      </form>
      <div id="loginMsg" class="msg hidden"></div>
    </div>
  </div>

  <!-- ===================== ADMIN PANEL ===================== -->
  <div class="container hidden" id="panelView">
    <h1>Захиалгын удирдлага</h1>

    <div class="stats" id="stats"></div>

    <!-- Add / edit order form -->
    <div class="card">
      <h2 id="formTitle">Шинэ захиалга нэмэх</h2>
      <form id="orderForm">
        <input type="hidden" id="orderId" />
        
        <!-- Phone (header, locked during batch entry) -->
        <div class="row">
          <div>
            <label>Утасны дугаар *</label>
            <input type="tel" id="fPhone" placeholder="99112233" required />
          </div>
        </div>
        
        <!-- Item entry section (only shown if not in edit mode) -->
        <div id="batchEntrySection">
          <h3 style="margin-top: 20px; margin-bottom: 12px; font-size: 1rem;">Барааны мөрүүд нэмэх</h3>
          <div class="row">
            <div>
              <label>Код</label>
              <input type="text" id="fCode" placeholder="79107232926362" />
            </div>
            <div>
              <label>Нэгж үнэ (₮)</label>
              <input type="number" id="fUnit" value="0" min="0" step="any" />
            </div>
            <div style="display: flex; align-items: flex-end;">
              <button type="button" class="btn" id="addItemBtn" style="margin: 0;">Нэмэх</button>
            </div>
          </div>
          
          <!-- Line items table -->
          <div class="table-wrap" style="margin-top: 16px; margin-bottom: 16px;">
            <table id="lineItemsTable" style="display: none;">
              <thead>
                <tr>
                  <th>Код</th>
                  <th>Нэгж үнэ</th>
                  <th>Нийт үнэ</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="lineItemsBody"></tbody>
            </table>
            <div id="lineItemsEmpty" class="empty" style="padding: 16px 0; margin: 0;">Одоогоор нэмсэн бараа алга</div>
          </div>
          
          <!-- Grand total -->
          <div style="background: var(--card-2); padding: 12px; border-radius: 8px; text-align: right; margin-bottom: 16px; display: none;" id="grandTotalSection">
            <div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 4px;">Нийт дүн</div>
            <div style="font-size: 1.4rem; font-weight: 700;" id="grandTotal">0</div>
          </div>
        </div>
        
        <!-- Edit mode section (only shown if editing an order) -->
        <div id="editModeSection" style="display: none;">
          <div class="row">
            <div>
              <label>Код *</label>
              <input type="text" id="fCodeEdit" placeholder="79107232926362" />
            </div>
          </div>
          <div class="row">
            <div>
              <label>Нэгж үнэ (₮)</label>
              <input type="number" id="fUnitEdit" value="0" min="0" step="any" />
            </div>
            <div>
              <label>Нийт үнэ (₮)</label>
              <input type="number" id="fTotalEdit" placeholder="авто" min="0" step="any" />
            </div>
          </div>
        </div>

        <div class="actions" style="margin-top:18px;">
          <button type="submit" class="btn" id="submitBtn">Захиалга нэмэх</button>
          <button type="button" class="btn secondary hidden" id="cancelEditBtn">Болих</button>
        </div>
        <div id="formMsg" class="msg hidden"></div>
      </form>
    </div>

    <!-- Orders list + search -->
    <div class="card">
      <div class="toolbar">
        <div class="grow">
          <label>Утасны дугаараар хайх</label>
          <input type="tel" id="searchPhone" placeholder="Бүх захиалгыг харахын тулд хоосон үлдээ" />
        </div>
        <button class="btn" id="searchBtn">Хайх</button>
        <button class="btn secondary" id="clearSearchBtn">Цэвэрлэх</button>
      </div>
      <div class="table-wrap">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>Утас</th>
              <th>Огноо</th>
              <th>Код</th>
              <th>Нэгж үнэ</th>
              <th>Нийт</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="ordersEmpty" class="empty hidden">Захиалга алга байна.</div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
